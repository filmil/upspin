# staticcheck configuration for CI. The SA checks (correctness) are
# enforced. SA1019 (use of deprecated API) is not, because the ee packer's
# calls into crypto/elliptic are deprecated but must stay byte for byte to
# keep stored data readable; replacing them is a cryptographic change that
# needs its own review (TODO.filmil.md). The S (simplification), ST (style)
# and U (unused) checks are informational for now.
checks = ["SA*", "-SA1019"]
