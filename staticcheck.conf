# staticcheck configuration for CI. Every check is enforced except:
#   SA1019  use of deprecated API. The ee packer's calls into
#           crypto/elliptic are deprecated but must stay byte for byte to
#           keep stored data readable; replacing them is a cryptographic
#           change that needs its own review (TODO.filmil.md, item 27).
#   ST1000  package comment missing, ST1003 identifier naming, ST1016
#           receiver names, ST1020 comment form: style rules the upstream
#           code never followed; ST1003 in particular would rename
#           exported identifiers.
checks = ["all", "-SA1019", "-ST1000", "-ST1003", "-ST1016", "-ST1020"]
