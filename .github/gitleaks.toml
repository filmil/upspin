# gitleaks configuration for this repository. The default rules apply; the
# paths below hold keys on purpose and are allow-listed by path, not by
# pattern, so that a real key committed anywhere else is still reported.
title = "upspin gitleaks config"

[extend]
useDefault = true

# One [allowlist] table, not [[allowlists]]: the gitleaks action runs
# gitleaks 8.24.3, which reads only the singular table and silently
# ignores [[allowlists]] (added in 8.25). With the plural form the
# allowlist did nothing, and the weekly full-history scan failed on these
# fixtures. A finding is allowed when its path or its secret matches
# (condition "OR", the default).
[allowlist]
description = "Test fixtures that are keys by design, and one hex reference value"
paths = [
  # Upstream TLS test key, regenerated by rpc/testdata/regen.
  '''^rpc/testdata/key\.pem$''',
  # Upspin test key pairs (public.upspinkey, secret.upspinkey, secret2.upspinkey).
  '''^key/testdata/''',
  '''^factotum/testdata/''',
  # Golden packed entries, which hold wrapped keys.
  '''^pack/ee/testdata/''',
  # The same TLS test key at its path before 2016-06, in upstream history.
  '''^auth/grpcauth/testdata/key\.pem$''',
]
regexes = [
  # A hex reference value in a 2016 upstream store test
  # (cmd/store/server_test.go), not a key.
  '''978[Ff]93921702''',
]
