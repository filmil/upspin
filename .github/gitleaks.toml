# gitleaks configuration for this repository. The default rules apply; the
# paths below hold keys on purpose and are allow-listed by path, not by
# pattern, so that a real key committed anywhere else is still reported.
title = "upspin gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures that are keys by design"
paths = [
  # Upstream TLS test key, regenerated by rpc/testdata/regen.
  '''^rpc/testdata/key\.pem$''',
  # Upspin test key pairs (public.upspinkey, secret.upspinkey, secret2.upspinkey).
  '''^key/testdata/''',
  '''^factotum/testdata/''',
  # Golden packed entries, which hold wrapped keys.
  '''^pack/ee/testdata/''',
  # The same TLS test key at its path before 2016-06, in upstream history.
  '''^auth/grpcauth/testdata/key\.pem$''',
]

[[allowlists]]
description = "A hex reference value in a 2016 upstream store test, not a key"
regexes = [
  '''978[Ff]93921702''',
]
