name: Bazel Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Once a week on Sunday at midnight

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-
            bazel-cache-${{ runner.os }}-

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workspace }}/.bazel-cache

      - name: Bazel Build
        run: bazel build //...

      - name: Bazel Test
        run: bazel test --test_output=errors //...







  # The race detector on the packages that share state across goroutines:
  # the packer registry and packers, the factotum, and the client. Kept
  # to those packages so the job stays a few minutes long.
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            .bazel-cache
          key: bazel-race-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            bazel-race-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-
            bazel-race-cache-${{ runner.os }}-

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workspace }}/.bazel-cache

      - name: Bazel Test with the race detector
        run: bazel test --@rules_go//go/config:race --test_output=errors //pack/... //factotum/... //client/...






  # Secrets committed by mistake. The tree holds test keys on purpose;
  # .github/gitleaks.toml allow-lists those paths and nothing else.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml





  # Known vulnerabilities in code paths the build reaches. govulncheck
  # needs a plain Go toolchain; it reads the version from go.mod.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-
            bazel-cache-${{ runner.os }}-

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workspace }}/.bazel-cache

      # The .pb.go files in the tree are symlinks into bazel-bin, so a
      # plain Go toolchain cannot compile the tree until Bazel has
      # generated them.
      - name: Build the generated protobuf sources
        run: bazel build //upspin/proto:proto_go_proto //rpc/testdata:prototest_go_proto

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...




  # Static analysis on a plain Go toolchain. go vet is enforced in full;
  # staticcheck runs the correctness checks named in staticcheck.conf;
  # gosec reports findings of high severity and high confidence, with
  # each accepted finding marked by a #nosec comment that says why.
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-
            bazel-cache-${{ runner.os }}-

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workspace }}/.bazel-cache

      # The .pb.go files in the tree are symlinks into bazel-bin, so a
      # plain Go toolchain cannot compile the tree until Bazel has
      # generated them.
      - name: Build the generated protobuf sources
        run: bazel build //upspin/proto:proto_go_proto //rpc/testdata:prototest_go_proto

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -severity high -confidence high ./...



  # Assistant commits must carry the trailers the SOP requires. On a pull
  # request the range is the PR's commits; on a push it is the pushed
  # commits.
  commit_trailers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit trailers
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          if [[ "$RANGE" == 0000000000000000000000000000000000000000..* ]]; then
            echo "new branch; nothing to compare against"; exit 0
          fi
          .github/scripts/check_trailers.sh "$RANGE"


  # The upspin binary from the base of the pull request and the one from
  # the branch must read each other's files. See test/compat.
  compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Date
        id: get-date
        run: echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-
            bazel-cache-${{ runner.os }}-

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workspace }}/.bazel-cache

      - name: Old binary against new binary
        run: .github/scripts/compat.sh ${{ github.event.pull_request.base.sha }}

  # Fuzz every parser for 60 seconds. Bazel does not drive the fuzz
  # engine, so the script runs go test -fuzz through Bazel's Go toolchain.
  # A failing input is written under testdata/fuzz and uploaded.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date -u '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            .bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-${{ steps.get-date.outputs.date }}-
            bazel-cache-${{ runner.os }}-

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workspace }}/.bazel-cache

      - name: Build the generated protobuf sources
        run: bazel build //upspin/proto:proto_go_proto //rpc/testdata:prototest_go_proto

      - name: Fuzz for 60 seconds per target
        run: .github/scripts/fuzz.sh 60s

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: |
            **/testdata/fuzz/**
