name: "Publish multi-arch container"

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
        description: 'Docker Hub user to publish as.'
      DOCKERHUB_TOKEN:
        required: true
        description: 'Docker Hub access token with write scope.'
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and publish, e.g. v43.0.3"
        required: true
        type: string

jobs:
  publish-container:
    name: "Push filipfilmar/upspin"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # Build the source as of the tag, so that re-running this workflow for an
      # older release reproduces that release rather than current main.
      - name: Checkout ${{ inputs.tag_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: "~/.cache/bazel"
          key: ${{ runner.os }}-container-bazel-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-container-bazel-
      # crane, which rules_oci invokes to push, reads ~/.docker/config.json.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Guard the tag before anything is pushed. //containers:remote_tags falls
      # back to the placeholder 0.0.0 when unstamped; refusing a non-semver tag
      # here means that placeholder can never be published by mistake.
      - name: Validate tag is an explicit version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG_NAME' is not an explicit version (expected e.g. v43.0.3)."
            exit 1
          fi
      # A tag created before versioned publishing existed still has
      # `remote_tags = ["latest"]` in its BUILD file, which silently ignores
      # --embed_label and would republish `latest`. Build the tag file first and
      # assert it carries the expected version, so that case fails loudly here
      # instead of quietly overwriting a floating tag in the registry.
      - name: Verify the checked-out source produces the expected version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          EXPECTED="${TAG_NAME#v}"
          # remote_tags carries the version as the image tag.
          bazel build --embed_label="$TAG_NAME" //containers:remote_tags
          ACTUAL="$(cat bazel-bin/containers/remote_tags.txt)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Source at '$TAG_NAME' yields tag(s) '$ACTUAL', expected '$EXPECTED'. That tag predates versioned container publishing; nothing was pushed."
            exit 1
          fi
          # The binaries carry it too: --config=release stamps the commit and
          # the release tag (tools/workspace_status.sh) into upspin.io/version,
          # which they report in -version and in upspin_build_info (issue 137).
          # Build what the push step pushes, with the same flags, and check
          # that every binary in the images names this tag and this commit.
          bazel build --config=release --embed_label="$TAG_NAME" //containers:push //containers:binaries_tar
          HEAD_COMMIT="$(git rev-parse HEAD)"
          STAMP_TAG="$(sed -n 's/^STABLE_RELEASE_TAG //p' bazel-out/stable-status.txt)"
          STAMP_COMMIT="$(sed -n 's/^STABLE_GIT_COMMIT //p' bazel-out/stable-status.txt)"
          echo "stamp: release=${STAMP_TAG} commit=${STAMP_COMMIT}; checkout: ${HEAD_COMMIT}"
          if [ "$STAMP_TAG" != "$TAG_NAME" ] || [ "$STAMP_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::The stamp names release '${STAMP_TAG}' and commit '${STAMP_COMMIT}', expected '$TAG_NAME' and '$HEAD_COMMIT' (a clean checkout of the tag); nothing was pushed."
            # Why a commit is "-dirty": git status, as the script saw it.
            grep -h '^GIT_STATUS ' bazel-out/volatile-status.txt || true
            exit 1
          fi
          stamped=0
          for t in //containers:binaries_tar; do
            tarfile="$(bazel cquery --config=release --embed_label="$TAG_NAME" --output=files "$t" 2>/dev/null | sed -n 1p)"
            if [ ! -f "$tarfile" ]; then
              echo "::error::$t built no tar file ('$tarfile'); nothing was pushed."
              exit 1
            fi
            # A listing that fails stops the step here (set -e), rather than
            # leaving the loop below with nothing to check.
            tar -tf "$tarfile" > "$RUNNER_TEMP/members"
            while IFS= read -r member; do
              case "$member" in */) continue ;; esac
              # To a file first: under pipefail, grep -q closing the pipe
              # early would fail tar with SIGPIPE.
              tar -xOf "$tarfile" "$member" > "$RUNNER_TEMP/stamped-binary"
              # A binary that does not link upspin.io/version (upbox, upspin-setupstorage)
              # has no version to stamp.
              if ! grep -a -q -F 'upspin.io/version.' "$RUNNER_TEMP/stamped-binary"; then
                echo "$member: does not link upspin.io/version; skipped"
                continue
              fi
              if ! grep -a -q -F "$HEAD_COMMIT" "$RUNNER_TEMP/stamped-binary" ||
                 ! grep -a -q -F "$TAG_NAME" "$RUNNER_TEMP/stamped-binary"; then
                echo "::error::$member in $t links upspin.io/version but does not carry the stamp ($TAG_NAME, $HEAD_COMMIT); nothing was pushed."
                exit 1
              fi
              stamped=$((stamped + 1))
            done < "$RUNNER_TEMP/members"
          done
          if [ "$stamped" -eq 0 ]; then
            echo "::error::No binary in the images carries the stamp; nothing was pushed."
            exit 1
          fi
          echo "$stamped binaries carry $TAG_NAME and $HEAD_COMMIT"
      # --embed_label drives //containers:remote_tags, which emits the bare
      # semver. It must precede the target: it is a bazel flag, not an argument
      # to the push script.
      # --config=release, as in the verify step, so that the push uses the
      # stamped binaries checked there.
      - name: "Push ${{ inputs.tag_name }}"
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          bazel run --config=release --embed_label="$TAG_NAME" //containers:push
      - name: Summary
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          echo "Pushed \`filipfilmar/upspin:${TAG_NAME#v}\` (linux/amd64 + linux/arm64)." >> "$GITHUB_STEP_SUMMARY"
