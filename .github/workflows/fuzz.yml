name: Weekly fuzz

# Runs every fuzz target for ten minutes, about an hour in all, once a
# week (Sunday 03:00 UTC) or on request, and opens a pull request with the
# corpus entries the engine found, so that each run starts from the last
# one's discoveries. Fuzzing is not part of the per-commit workflow: an
# hour of it on every pull request is too slow, and bazel test still runs
# the committed seed corpus of every target on each commit.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-bazel keeps three caches, all keyed by content: Bazelisk
      # downloads, the repository cache (by MODULE files) and the Bazel disk
      # cache (by BUILD files), the last one under a per-job name so that
      # jobs do not race to save the same key and each restores its own.
      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.job }}
          repository-cache: true

      - name: Build the generated protobuf sources
        run: bazel build --remote_download_outputs=all //upspin/proto:proto_go_proto //rpc/testdata:prototest_go_proto

      - name: Fuzz for ten minutes per target
        run: .github/scripts/fuzz.sh 10m

      - name: Open a pull request with new corpus entries
        uses: peter-evans/create-pull-request@v7
        with:
          branch: fuzz/weekly-corpus
          commit-message: |
            test: add fuzz corpus entries from the weekly run

            Corpus entries the weekly fuzz job found; see
            .github/workflows/fuzz.yml.

            This commit has been created by an automated workflow,
            with human supervision at review time.

            Prompt:
            > (none: scheduled workflow)
          title: "test: fuzz corpus entries from the weekly run"
          body: |
            Corpus entries found by the weekly fuzz job
            (`.github/workflows/fuzz.yml`). Each is an input the
            engine found interesting; committing them makes the next run
            start where this one stopped. If the job failed, one of them
            is a failing input that needs a fix.
          add-paths: |
            **/testdata/fuzz/**
          delete-branch: true
