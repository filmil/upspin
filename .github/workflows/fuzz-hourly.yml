# Short fuzzing (60 s per target), moved out of the pull request checks: at
# most once an hour, and only when main has commits the fuzz has not run on.
# A manual run always fuzzes main. The long weekly run, which also grows the
# corpus, is fuzz.yml. fuzz.sh's own test stays in the pull request checks
# (bazel.yml, fuzz_script), and bazel test runs every target's seed corpus.
name: Hourly fuzz

on:
  schedule:
    - cron: '23 * * * *' # hourly
  workflow_dispatch:

# One run at a time: a scheduled run waits for the one before it.
concurrency:
  group: fuzz-hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Was anything merged since the last fuzz? Compares main with the commit
  # that the fuzz job last ran on, in a run that finished: runs where it was
  # skipped, cancelled or never started do not count. If that fuzz failed
  # and main has not moved, this job fails too, so that the workflow stays
  # red until a new commit is fuzzed, rather than turning green while the
  # failure stands.
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - name: Look for commits the fuzz has not seen
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Always main, also for a manual run started from another branch.
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: fuzzing main at $head."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest finished run whose fuzz job ran: its commit and result.
          last="" result=""
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/fuzz-hourly.yml/runs?status=completed&per_page=30" \
                --jq ".workflow_runs[] | select(.id != ${RUN_ID}) | .id"); do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "fuzz") | select(.conclusion == "success" or .conclusion == "failure") | .conclusion][0] // ""')"
            if [ -n "$result" ]; then
              last="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id" --jq .head_sha)"
              break
            fi
          done
          if [ "$last" != "$head" ]; then
            echo "main is $head; the fuzz last ran on ${last:-nothing yet}. Fuzzing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$result" = failure ]; then
            echo "::error::The fuzz failed on $head, and main has not moved since."
            exit 1
          else
            echo "main is still $head, fuzzed with success; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Fuzz every parser for 60 seconds. Bazel does not drive the fuzz
  # engine, so the script runs go test -fuzz through Bazel's Go toolchain.
  # A failing input is written under testdata/fuzz and uploaded.
  fuzz:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    # 60 s per target plus the build. A hang must not hold the queue for
    # GitHub's default 6 hours.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The commit check looked at: main, even for a manual run
          # started from another branch.
          ref: ${{ needs.check.outputs.sha }}

      # setup-bazel keeps three caches, all keyed by content: Bazelisk
      # downloads, the repository cache (by MODULE files) and the Bazel disk
      # cache (by BUILD files), the last one under a per-job name so that
      # jobs do not race to save the same key and each restores its own.
      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.job }}
          repository-cache: true

      - name: Build the generated protobuf sources
        run: bazel build --remote_download_outputs=all //upspin/proto:proto_go_proto //rpc/testdata:prototest_go_proto

      # fuzz.sh counts Go's own deadline error as a pass (golang/go#75804);
      # check first that it still fails real failures.
      - name: Test fuzz.sh
        run: .github/scripts/fuzz_test.sh

      - name: Fuzz for 60 seconds per target
        run: .github/scripts/fuzz.sh 60s

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: |
            **/testdata/fuzz/**
