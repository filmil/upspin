name: "Publish to my Bazel registry"

on:
  workflow_call:
    secrets:
      BCR_PUBLISH_TOKEN:
        required: false
        description: 'Optional token for BCR publishing.'
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      registry: filmil/bazel-registry
      registry_fork: filmil/bazel-registry
      # Only one publish workflow may attest, and it is the BCR one.
      #
      # Every publish-to-bcr run with `attest: true` uploads
      # MODULE.bazel.intoto.jsonl and source.json.intoto.jsonl to the release
      # under those fixed names, and records the hash of the file it uploaded
      # in the attestations.json of the registry it writes. Two attesting
      # publishes therefore overwrite each other, and whichever ran first is
      # left naming hashes the release no longer serves.
      #
      # BCR verifies attestations at presubmit and this registry does not, so
      # BCR keeps them. Entries here simply have no attestations.json.
      attest: false
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
